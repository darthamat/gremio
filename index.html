<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gremio de Exploradores de los mundos de tinta</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/landing.css">

</head>

<body>

<main class="guild">

    <header class="hero">

        <p class="hero-subtitle">
            Fundado por los miembros del club de lectura "Frinchiken" y "LuisNoElige"
        </p>

        <h1>
            Gremio de los Exploradores de los mundos de tinta
        </h1>

        <p class="hero-text">
            Todo libro es un portal.<br>
            Todo lector, un aventurero.
        </p>

    </header>

    <!-- <section class="book-area">

        <div class="book-pedestal">

            <div class="guild-book">

                <div class="book-light"></div>

                <img
                    src="assets/images/book-placeholder.png"
                    alt="Libro de la Expedición del Mes">

            </div>

        </div>

    </section> -->

    <section class="actions">

      
    <button class="guild-button primary" id="btn-login" type="button">
        ⚔️ He recibido la carta
    </button>

    <form class="login-box hidden" id="login-form">
        <div class="form-group">
            <label for="username">Correo del Aventurero</label>
            <input type="email" id="username" placeholder="Ej. elminster@example.com" required>
        </div>
        
        <div class="form-group">
            <label for="password">Palabra Mágica</label>
            <input type="password" id="password" placeholder="••••••••" required>
        </div>

        <button type="submit" id="submit-btn" class="guild-button magic-btn">
            ✨ Entrar al gremio
        </button>
    </form>

    <button class="guild-button" type="button" onclick="window.location.href='lore.html';">
        🛡 ¿Qué carta?
    </button>

    <button class="guild-button" type="button" onclick="window.location.href='registro.html';">
        ✨ Comenzar una Nueva Leyenda
    </button>

</section>



</main>

<script type="module" src="js/landing.js"></script>
<script type="module" src="js/login.js"></script>


</body>
</html>
