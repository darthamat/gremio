<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablón de Anuncios y Contratos - Gremio de Exploradores</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body.tablon-madera {
            background-color: #16100c;
            background-image: radial-gradient(circle, #2b1d14 0%, #110c08 100%);
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .tablon-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 25px;
            background: rgba(30, 20, 12, 0.92);
            border: 6px solid #5c3a21;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.6);
            border-radius: 8px;
            position: relative;
        }

        .tablon-header {
            text-align: center;
            border-bottom: 3px double #8b5a2b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .tablon-header h1 {
            color: #ffd700;
            margin: 0 0 5px 0;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Sistema de Pestañas por Ciclos (Años y Meses) */
        .selector-ciclos {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn-ciclo {
            background: #3b2219;
            color: #f3e5ab;
            border: 2px solid #8b5a2b;
            padding: 8px 16px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ciclo:hover {
            background: #5a3a1a;
            color: #ffd700;
        }

        .btn-ciclo.activo {
            background: #8b5a2b;
            color: #fff;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* Cuadrícula de Pergaminos del Tablón */
        .pergamino-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .pergamino-card {
            background: #fdf6e3;
            color: #3b2219;
            border: 2px solid #b58d51;
            border-radius: 6px;
            padding: 18px;
            box-shadow: 3px 5px 12px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pergamino-card::before {
            content: '📌';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
        }

        .pergamino-card h3 {
            margin: 0 0 8px 0;
            font-size: 1.05rem;
            color: #2a150c;
            border-bottom: 1px dashed #b58d51;
            padding-bottom: 6px;
            word-break: break-word;
        }

        .btn-accion-tablon {
            background: #8b5a2b;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 8px 12px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.85rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: background 0.2s;
        }

        .btn-accion-tablon:hover {
            background: #5a3a1a;
        }

        .nav-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="tablon-madera">

    <div class="tablon-container">
        <div class="nav-superior">
            <a href="gremio.html" class="btn-ciclo">🏰 Volver al Gremio</a>
            <button id="btn-abrir-buscador-mision" class="btn-ciclo" style="background: #2e7d32; border-color: #ffd700;">✨ Abrir Nuevo Contrato</button>
        </div>

        <div class="tablon-header">
            <h1>📜 Tablón de Misiones Secundarias</h1>
            <p style="color: #d4af37; font-style: italic;">Expediciones y contratos del Cónclave clavados en el roble milenario.</p>
        </div>

        <!-- Pestañas de Años y Meses generadas dinámicamente -->
        <div id="contenedor-pestanas-ciclos" class="selector-ciclos">
            <!-- Se inyecta con js -->
        </div>

        <!-- Contenedor de Pergaminos -->
        <div id="tablon-misiones-lista" class="pergamino-grid">
            <p style="text-align: center; font-style: italic; width: 100%;">Examinando los contratos del tablón...</p>
        </div>
    </div>

    <!-- MODAL: ABRIR NUEVO CONTRATO (Sincronizado con estilos de perfil.css) -->
    <div id="modal-buscador-mision" class="modal-overlay oculto">
        <div class="modal-mision-content">
            <button id="btn-cerrar-modal-mision">&times;</button>
            <h2>Abrir Contrato en el Tablón</h2>
            
            <!-- BUSCADOR GOOGLE BOOKS -->
            <div style="margin-bottom: 15px; position: relative;">
                <label style="font-weight:bold; display:block; margin-bottom:5px;">🔍 Buscar en Google Books:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="input-buscar-libro" placeholder="Escribe título o autor...">
                    <button type="button" id="btn-ejecutar-busqueda" style="margin-top:0; width:auto;">Buscar</button>
                </div>
                <div id="resultados-busqueda-libros"></div>
            </div>

            <form id="form-crear-portal">
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Título del Libro:</label>
                <input type="text" id="mision-titulo" required>
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Autor:</label>
                <input type="text" id="mision-autor" required>
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Páginas:</label>
                <input type="number" id="mision-paginas" required>
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">URL de Portada:</label>
                <input type="url" id="mision-portada-url">

                <label style="font-weight:bold; display:block; margin-bottom:3px;">Proclama o Descripción:</label>
                <textarea id="mision-proclama" rows="2"></textarea>

                <button type="submit" class="btn-accion" style="background:#2e7d32; border-color:#ffd700; width:100%; margin-top:10px;">Clavar Contrato en el Tablón</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/misiones.js"></script>
</body>
</html>
