<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gremio - Tablón de Misiones Secundarias</title>
  <link rel="stylesheet" href="css/retos.css">
  <style>
    .tablon-container {
      max-width: 900px;
      margin: 30px auto;
      background: var(--bg-pergamino, #f3e5ab);
      border: 4px solid var(--borde-pergamino, #8b5a2b);
      padding: 25px;
      border-radius: 6px;
      color: var(--texto-pergamino, #3b2219);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
    .header-tablon {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid #8b5a2b;
      padding-bottom: 10px;
    }
    .btn-secundario {
      padding: 8px 12px;
      font-size: 0.9rem;
      font-weight: bold;
      background: #8b5a2b;
      color: #fff;
      border: 1px solid #d4af37;
      border-radius: 4px;
      text-decoration: none;
      cursor: pointer;
    }
    .btn-secundario:hover {
      background: #a66c35;
    }
    .grid-misiones {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }
    .tarjeta-mision {
      background: rgba(255, 248, 231, 0.9);
      border: 2px solid #5a3a1a;
      border-radius: 6px;
      padding: 15px;
      display: flex;
      gap: 20px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
    .tarjeta-mision.cerrada {
      opacity: 0.8;
      border-color: #714b29;
      background: rgba(220, 205, 175, 0.7);
    }
    .mision-portada {
      width: 100px;
      height: 140px;
      object-fit: cover;
      border: 2px solid #8b5a2b;
      border-radius: 4px;
      flex-shrink: 0;
    }
    .mision-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .mision-titulo {
      font-size: 1.2rem;
      font-weight: bold;
      color: #2a150c;
      margin-bottom: 4px;
    }
    .mision-meta {
      font-size: 0.85rem;
      color: #5c4033;
      margin-bottom: 8px;
    }
    .mision-descripcion {
      font-size: 0.95rem;
      font-style: italic;
      margin-bottom: 10px;
      background: rgba(139, 90, 43, 0.05);
      padding: 8px;
      border-radius: 4px;
    }
    .mision-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      border-top: 1px dashed #8b5a2b;
      padding-top: 8px;
    }
    .badge-coop {
      background: #3b2219;
      color: #f3e5ab;
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 0.75rem;
      font-weight: bold;
    }
    .acciones-mision {
      display: flex;
      gap: 8px;
    }
    .btn-accion {
      padding: 6px 12px;
      font-size: 0.85rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #5a3a1a;
    }
    .btn-aceptar {
      background: #2e7d32;
      color: white;
    }
    .btn-aceptar:hover { background: #388e3c; }
    .btn-terminar {
      background: #c62828;
      color: white;
    }
    .btn-terminar:hover { background: #d32f2f; }
    .btn-completado {
      background: #455a64;
      color: #cfd8dc;
      cursor: not-allowed;
    }
    .sin-misiones {
      text-align: center;
      font-style: italic;
      padding: 30px;
      color: #5c4033;
    }
  </style>
</head>
<body>

  <header class="header-gremio">
    <h1>📜 Tablón de Encargos - Misiones Secundarias</h1>
  </header>

  <main class="tablon-container">
    <div class="header-tablon">
      <a href="perfil.html" class="btn-secundario">⬅️ Volver al Refugio</a>
      <a href="crearMisionSecundaria.html" class="btn-secundario">➕ Clavar Nuevo Encargo</a>
    </div>

    <div id="contenedor-misiones" class="grid-misiones">
      <div class="sin-misiones">⏳ Leyendo pergaminos del tablón...</div>
    </div>
  </main>

  <!-- Lógica integrada para cargar y gestionar las misiones secundarias -->
  <script type="module">
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      getDocs, 
      doc, 
      getDoc,
      updateRecord, // o setDoc con merge
      updateDoc,
      arrayUnion,
      increment
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { app } from "./firebase-config.js";

    const auth = getAuth(app);
    const db = getFirestore(app);
    const contenedorMisiones = document.getElementById("contenedor-misiones");

    let usuarioActual = null;

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "index.html";
        return;
      }
      usuarioActual = user;
      await cargarMisionesSecundarias();
    });

    async function cargarMisionesSecundarias() {
      try {
        const querySnapshot = await getDocs(collection(db, "misionesSecundarias"));
        if (querySnapshot.empty) {
          contenedorMisiones.innerHTML = `<div class="sin-misiones">No hay contratos clavados en el tablón en este momento. ¡Sé el primero en colgar uno!</div>`;
          return;
        }

        contenedorMisiones.innerHTML = "";
        querySnapshot.forEach((misionDoc) => {
          const data = misionDoc.data();
          const id = misionDoc.id;
          
          const esCreador = data.creadorId === usuarioActual.uid;
          const yaAcepto = data.usuariosAceptaron && data.usuariosAceptaron.includes(usuarioActual.uid);
          const yaCompleto = data.usuariosCompletaron && data.usuariosCompletaron.includes(usuarioActual.uid);
          const estaActiva = data.activa !== false;

          const card = document.createElement("div");
          card.className = `tarjeta-mision ${!estaActiva ? 'cerrada' : ''}`;
          
          card.innerHTML = `
            <img src="${data.portadaUrl || data.portada || 'https://images.unsplash.com/photo-1543002588-bfa74002ed7e?w=400'}" class="mision-portada" alt="Portada">
            <div class="mision-info">
              <div>
                <div class="mision-titulo">${data.titulo}</div>
                <div class="mision-meta">
                  ✍️ Autor: <strong>${data.autor}</strong> | 📖 ${data.paginas} págs | 👤 Proponente: <strong>${data.proponente || 'Anónimo'}</strong>
                </div>
                <div class="mision-descripcion">"${data.descripcion || 'Sin proclama.'}"</div>
              </div>

              <div>
                <div style="font-size: 0.8rem; margin-bottom: 5px;">
                  🏷️ Géneros: ${(data.generos || []).join(", ")} | 👥 Lectores en ruta: ${data.usuariosAceptaron ? data.usuariosAceptaron.length : 1}
                </div>
                <div class="mision-footer">
                  <div>
                    <span class="badge-coop">${estaActiva ? '🟢 Contrato Activo' : '🔴 Misión Concluida'}</span>
                    <span style="font-size: 0.8rem; margin-left: 8px;">Prestigio base + 🎁 <strong>+100 Bono Co-op</strong></span>
                  </div>
                  <div class="acciones-mision" id="acciones-${id}">
                    <!-- Los botones se renderizan dinámicamente -->
                  </div>
                </div>
              </div>
            </div>
          `;

          contenedorMisiones.appendChild(card);
          renderizarBotonesAccion(id, data, esCreador, yaAcepto, yaCompleto, estaActiva);
        });

      } catch (err) {
        console.error("Error cargando misiones:", err);
        contenedorMisiones.innerHTML = `<div class="sin-misiones">❌ Error al cargar los pergaminos del tablón.</div>`;
      }
    }

    function renderizarBotonesAccion(id, data, esCreador, yaAcepto, yaCompleto, estaActiva) {
      const contenedorAcciones = document.getElementById(`acciones-${id}`);
      if (!contenedorAcciones) return;

      contenedorAcciones.innerHTML = "";

      if (yaCompleto) {
        contenedorAcciones.innerHTML = `<button class="btn-accion btn-completado" disabled>✔️ Misión Terminada</button>`;
        return;
      }

      if (!estaActiva) {
        contenedorAcciones.innerHTML = `<span style="font-size: 0.85rem; font-style: italic; color: #7f5539;">Cerrado a nuevos ingresos</span>`;
        return;
      }

      // Si ya está aceptada y activa, puede marcarla como terminada
      if (yaAcepto) {
        const btnTerminar = document.createElement("button");
        btnTerminar.className = "btn-accion btn-terminar";
        btnTerminar.textContent = "🏁 Dar por Terminado";
        btnTerminar.onclick = () => completarMision(id, data);
        contenedorAcciones.appendChild(btnTerminar);
      } else {
        // Si no la ha aceptado y sigue activa, puede aceptarla
        const btnAceptar = document.createElement("button");
        btnAceptar.className = "btn-accion btn-aceptar";
        btnAceptar.textContent = "⚔️ Aceptar Encargo";
        btnAceptar.onclick = () => aceptarMision(id);
        contenedorAcciones.appendChild(btnAceptar);
      }

      // Si además es el creador, tiene el poder de clausurar el reclutamiento para nuevos jugadores
      if (esCreador && estaActiva) {
        const btnCerrar = document.createElement("button");
        btnCerrar.className = "btn-accion";
        btnCerrar.style.background = "#5d4037";
        btnCerrar.style.color = "#fff";
        btnCerrar.textContent = "🔒 Cerrar Reclutamiento";
        btnCerrar.title = "Nadie más podrá apuntarse, pero los actuales pueden terminarlo.";
        btnCerrar.onclick = () => cerrarReclutamiento(id);
        contenedorAcciones.appendChild(btnCerrar);
      }
    }

    // Funciones de interacción con Firestore
    async function aceptarMision(id) {
      try {
        const misionRef = doc(db, "misionesSecundarias", id);
        await updateDoc(misionRef, {
          usuariosAceptaron: arrayUnion(usuarioActual.uid)
        });
        alert("¡Te has unido al encargo cooperativo!");
        await cargarMisionesSecundarias();
      } catch (err) {
        console.error("Error al aceptar misión:", err);
        alert("No se pudo aceptar la misión.");
      }
    }

    async function cerrarReclutamiento(id) {
      if (!confirm("¿Seguro que deseas cerrar la entrada a nuevos aventureros? Los actuales podrán seguir hasta el final.")) return;
      try {
        const misionRef = doc(db, "misionesSecundarias", id);
        await updateDoc(misionRef, { activa: false });
        alert("Reclutamiento cerrado.");
        await cargarMisionesSecundarias();
      } catch (err) {
        console.error("Error al cerrar reclutamiento:", err);
      }
    }

    async function completarMision(id, data) {
      if (!confirm("¿Definitivas tus páginas y marcas este grimorio como concluido? Recibirás tus puntos de prestigio y bono cooperativo.")) return;
      try {
        const misionRef = doc(db, "misionesSecundarias", id);
        const userRef = doc(db, "aventureros", usuarioActual.uid);

        // 1. Añadir usuario a completaron en la misión (y cerrarla si es el creador quien la termina)
        const updates = {
          usuariosCompletaron: arrayUnion(usuarioActual.uid)
        };
        if (data.creadorId === usuarioActual.uid) {
          updates.activa = false; // El creador del reto original da por terminado -> se cierra por completo
        }
        await updateDoc(misionRef, updates);

        // 2. Otorgar recompensas al usuario (Prestigio base de la página/libro + Bono cooperativo de 100 puntos)
        // Nota: Cálculo de prestigio base aproximado por páginas (ej: 1 pág = 0.5 o valor fijo, o basado en puntos si lo tuviera, aquí asignamos base de prestigio + 100 bono co-op)
        const prestigioBase = (data.paginas || 100) * 0.5; // Ajustable a tu economía de juego
        const prestigioTotal = Math.round(prestigioBase + 100); 

        // 3. Actualizar al aventurero en Firestore (Prestigio, rasgos y cicatrices)
        const userDocSnap = await getDoc(userRef);
        let rasgActuales = [];
        let cicatActuales = [];
        if (userDocSnap.exists()) {
          rasgActuales = userDocSnap.data().rasgos || [];
          cicatActuales = userDocSnap.data().cicatrices || [];
        }

        // Combinar nuevos rasgos/cicatrices sin duplicar
        const nuevosRasgos = [...new Set([...rasgActuales, ...(data.rasgosOtorga || [])])];
        const nuevasCicatrices = [...new Set([...cicatActuales, ...(data.cicatricesOtorga || [])])];

        await updateDoc(userRef, {
          prestigio: increment(prestigioTotal),
          rasgos: nuevosRasgos,
          cicatrices: nuevasCicatrices
        });

        // 4. Registrar opcionalmente en biblioteca general sin crear Hex en el Atlas (como indicaste)
        // (La lógica del Atlas comprueba el origen, aquí solo aseguramos que no afecte al mapa principal).

        alert(`🎉 ¡Misión completada con éxito!\nHas ganado ${prestigioTotal} Puntos de Prestigio (incluyendo +100 del bono cooperativo) y nuevas huellas en tu historial.`);
        await cargarMisionesSecundarias();

      } catch (err) {
        console.error("Error al completar misión:", err);
        alert("Ocurrió un error al registrar la conclusión de la misión.");
      }
    }
  </script>
</body>
</html>
