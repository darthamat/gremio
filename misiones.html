<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tablón de Anuncios y Contratos - Gremio de Exploradores</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=MedievalSharp&display=swap" rel="stylesheet">
    <style>
        body.tablon-madera {
            background-color: #16100c;
            background-image: radial-gradient(circle, #2b1d14 0%, #110c08 100%);
            color: #f3e5ab;
            font-family: 'Cinzel', serif;
            margin: 0;
            padding: 0;
        }

        .tablon-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
            background: rgba(30, 20, 12, 0.9);
            border: 6px solid #5c3a21;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.6);
            border-radius: 8px;
            position: relative;
        }

        .tablon-header {
            text-align: center;
            border-bottom: 3px double #8b5a2b;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        .tablon-header h1 {
            color: #ffd700;
            margin: 0 0 5px 0;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        /* Sistema de Pestañas por Años y Meses */
        .selector-ciclos {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .btn-ciclo {
            background: #3b2219;
            color: #f3e5ab;
            border: 2px solid #8b5a2b;
            padding: 8px 16px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .btn-ciclo.activo {
            background: #8b5a2b;
            color: #fff;
            border-color: #ffd700;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
        }

        /* Estilo Pergamino de Contrato / Misión */
        .pergamino-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .pergamino-card {
            background: #fdf6e3;
            color: #3b2219;
            border: 2px solid #b58d51;
            border-radius: 4px;
            padding: 15px;
            box-shadow: 3px 5px 12px rgba(0,0,0,0.5);
            position: relative;
            display: flex;
            gap: 12px;
            align-items: flex-start;
        }

        .pergamino-card::before {
            content: '📌';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.2rem;
        }

        .pergamino-card.completado {
            background: rgba(243, 229, 171, 0.5);
            border-style: dashed;
            padding: 10px 15px;
            opacity: 0.85;
        }

        /* Efecto lomo / recorte cuando está completado */
        .pergamino-card.completado .detalles-completos {
            display: none; 
        }

        .pergamino-portada {
            width: 65px;
            height: 95px;
            object-fit: cover;
            border-radius: 3px;
            border: 1px solid #8b5a2b;
            flex-shrink: 0;
        }

        .pergamino-info {
            flex-grow: 1;
        }

        .pergamino-card h3 {
            margin: 0 0 6px 0;
            font-size: 1rem;
            color: #2a150c;
            border-bottom: 1px dashed #b58d51;
            padding-bottom: 4px;
        }

        .btn-accion-tablon {
            background: #8b5a2b;
            color: #fff;
            border: 1px solid #d4af37;
            padding: 6px 12px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.8rem;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
        }

        .btn-accion-tablon:hover {
            background: #5a3a1a;
        }

        .nav-superior {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
    </style>
</head>
<body class="tablon-madera">

    <div class="tablon-container">
        <div class="nav-superior">
            <a href="gremio.html" class="btn-ciclo">🏰 Volver al Gremio</a>
            <button id="btn-abrir-buscador-mision" class="btn-ciclo" style="background: #2e7d32; border-color: #ffd700;">✨ Abrir Nuevo Contrato</button>
        </div>

        <div class="tablon-header">
            <h1>📜 Tablón de Misiones Secundarias</h1>
            <p style="color: #d4af37; font-style: italic;">Expediciones y contratos del Cónclave clavados en el roble milenario.</p>
        </div>

        <!-- Pestañas de Años y Meses generadas dinámicamente -->
        <div id="contenedor-pestanas-ciclos" class="selector-ciclos">
            <!-- Se inyecta con js -->
        </div>

        <!-- Contenedor de Pergaminos -->
        <div id="tablon-misiones-lista" class="pergamino-grid">
            <p style="text-align: center; font-style: italic; width: 100%;">Examinando los contratos del tablón...</p>
        </div>
    </div>

    <!-- MODAL: ABRIR NUEVO CONTRATO CON BUSCADOR GOOGLE BOOKS -->
    <div id="modal-buscador-mision" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:1000; justify-content:center; align-items:center; overflow-y:auto; padding:20px 0;">
        <div style="background: #fdf6e3; color: #3b2219; padding: 25px; border-radius: 6px; width: 90%; max-width: 550px; border: 3px solid #8b5a2b; position:relative; margin:auto;">
            <button id="btn-cerrar-modal-mision" style="position:absolute; top:10px; right:15px; background:none; border:none; font-size:1.5rem; cursor:pointer; font-weight:bold;">&times;</button>
            <h2 style="color: #8b5a2b; margin-top:0; text-align:center;">Abrir Contrato en el Tablón</h2>
            
            <!-- BUSCADOR GOOGLE BOOKS -->
            <div style="margin-bottom: 15px; position: relative;">
                <label style="font-weight:bold; display:block; margin-bottom:5px;">🔍 Buscar en Google Books:</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="input-buscar-libro" placeholder="Escribe título o autor..." style="flex:1; padding:8px; border:1px solid #8b5a2b; background:#fff8e7;">
                    <button type="button" id="btn-ejecutar-busqueda" class="btn-accion-tablon" style="margin-top:0; width:auto;">Buscar</button>
                </div>
                <div id="resultados-busqueda-libros" style="display:none; position:absolute; top:100%; left:0; right:0; max-height:200px; overflow-y:auto; background:#2a221b; color:#fff8e7; border:1px solid #8b5a2b; z-index:100; border-radius:4px;"></div>
            </div>

            <form id="form-crear-portal">
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Título del Libro:</label>
                <input type="text" id="mision-titulo" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #8b5a2b; background:#fff8e7; box-sizing:border-box;">
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Autor:</label>
                <input type="text" id="mision-autor" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #8b5a2b; background:#fff8e7; box-sizing:border-box;">
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">Páginas:</label>
                <input type="number" id="mision-paginas" required style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #8b5a2b; background:#fff8e7; box-sizing:border-box;">
                
                <label style="font-weight:bold; display:block; margin-bottom:3px;">URL de Portada:</label>
                <input type="url" id="mision-portada-url" style="width:100%; padding:8px; margin-bottom:10px; border:1px solid #8b5a2b; background:#fff8e7; box-sizing:border-box;">

                <label style="font-weight:bold; display:block; margin-bottom:3px;">Proclama o Descripción:</label>
                <textarea id="mision-proclama" rows="2" style="width:100%; padding:8px; margin-bottom:15px; border:1px solid #8b5a2b; background:#fff8e7; box-sizing:border-box;"></textarea>

                <button type="submit" class="btn-accion-tablon" style="background:#2e7d32;">Clavar Contrato en el Tablón</button>
            </form>
        </div>
    </div>

    <script type="module" src="js/misiones.js"></script>
</body>
</html>
