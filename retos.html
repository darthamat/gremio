<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retos y Expediciones - Gremio de Exploradores</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/gremio.css">
  <link rel="stylesheet" href="css/retos.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

  <div class="dashboard-container">
    <header class="guild-header">
      <h1 class="guild-title">Cartel de Retos y Misiones</h1>
      <p class="guild-motto">«Propuesto por <span id="proponente-reto">Cargando...</span>»</p>
    </header>

    <main class="retos-main-content">
      <!-- SECCIÓN DEL RETO DEL MES ACTIVO -->
      <section class="seccion-reto-activo">
        <h2 class="header-gremio h1">🗡️ Misión del Mes en Curso</h2>
        <div id="contenedor-reto-actual">
          <p class="sin-datos">Cargando misión desde el cónclave...</p>
        </div>
      </section>

      <!-- SECCIÓN DE HISTÓRICO DE EXPEDICIONES -->
      <section class="seccion-retos-historico">
        <h2 class="header-gremio h1">📜 Histórico de Misiones Pasadas</h2>
        <div id="contenedor-retos-pasados" class="grid-retos-pasados">
          <!-- Se inyectarán dinámicamente los retos de meses pasados (ej: reto26_01, reto25_12) -->
        </div>
      </section>
    </main>

    <footer class="guild-footer">
      <a href="gremio.html" class="btn-regresar">⬅️ Volver al gremio</a>
    </footer>
  </div>

  <script type="module" src="js/auth-guard.js"></script>
  <script type="module" src="js/retos.js"></script>
</body>
</html>
