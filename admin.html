<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gremio - Panel de Administración de Retos</title>
  <link rel="stylesheet" href="retos.css">
  <style>
    .admin-container {
      max-width: 600px;
      margin: 30px auto;
      background: var(--bg-pergamino, #f3e5ab);
      border: 4px solid var(--borde-pergamino, #8b5a2b);
      padding: 25px;
      border-radius: 6px;
      color: var(--texto-pergamino, #3b2219);
      box-shadow: 0 10px 20px rgba(0,0,0,0.6);
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      flex-direction: column;
      text-align: left;
    }
    .form-group label {
      font-weight: bold;
      margin-bottom: 5px;
    }
    .form-group input, .form-group textarea {
      padding: 10px;
      border: 2px solid #5a3a1a;
      border-radius: 4px;
      font-size: 1rem;
      background: #fff8e7;
      color: #3b2219;
    }
    .btn-crear {
      width: 100%;
      padding: 12px;
      font-size: 1.1rem;
      margin-top: 10px;
    }
    .mensaje-estado {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header class="header-gremio">
    <h1>⚔️ Panel del Administrador - Crear Reto</h1>
  </header>

  <main class="admin-container">
    <form id="form-crear-reto">
      <div class="form-group">
        <label for="titulo">Título del Libro / Reto:</label>
        <input type="text" id="titulo" placeholder="Ej: La Sombra del Viento" required>
      </div>

      <div class="form-group">
        <label for="puntosPrestigio">Puntos de Prestigio:</label>
        <input type="number" id="puntosPrestigio" min="1" placeholder="Ej: 100" required>
      </div>

      <div class="form-group">
        <label for="descripcion">Descripción / Requisitos del Reto:</label>
        <textarea id="descripcion" rows="4" placeholder="Ej: Leer antes de fin de mes y comentar en la reunión..." required></textarea>
      </div>

      <div class="form-group">
        <label for="portadaFile">Portada del Libro (Cloudinary):</label>
        <input type="file" id="portadaFile" accept="image/*" required>
      </div>

      <button type="submit" class="btn-reto btn-crear" id="btn-submit">📜 Publicar Reto Mensual</button>
    </form>

    <div id="mensaje-estado" class="mensaje-estado"></div>
  </main>

  <script type="module" src="js/admin.js"></script>
</body>
</html>
